name: nabve

x-host-integration: &host-integration
  # Host networking keeps the backend at 127.0.0.1:8756 exactly like a native
  # run, lets it reach a host Ollama on 127.0.0.1:11434, and lets the LAN-IP
  # detection for the phone QR code (core/config.py) see the real interface.
  network_mode: host
  # Deliberate trust trade-off for a single-user local assistant: D-Bus,
  # X11 and audio devices must reach the host (shutdown/reboot, keyring,
  # notify-send, microphone, pyautogui). Never expose this beyond localhost.
  privileged: true

services:
  nabve:
    <<: *host-integration
    build:
      context: .
      target: runtime
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
        TORCH_INDEX_URL: "${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}"
    image: nabve:local
    # Rebuild on every `docker compose up` — BuildKit caches every layer, so an
    # unchanged tree rebuilds in seconds and a changed one is never stale.
    pull_policy: build
    container_name: nabve
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    env_file:
      - path: .env
        required: false
    environment:
      ASSISTANT_PORT: "${ASSISTANT_PORT:-8756}"
      DISPLAY: "${DISPLAY:-:0}"
      XAUTHORITY: /tmp/.Xauthority
      DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/${UID:-1000}/bus"
      PULSE_SERVER: "unix:/run/user/${UID:-1000}/pulse/native"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY_HOST:-${HOME}/.Xauthority}:/tmp/.Xauthority:ro
      - /run/user/${UID:-1000}/bus:/run/user/${UID:-1000}/bus
      - /run/user/${UID:-1000}/pulse:/run/user/${UID:-1000}/pulse
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: nabve-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  ollama-models:
