name: Build and Release

# Собирает установщики (Windows .exe + Linux .AppImage) и публикует их
# GitHub Release при пуше тега вида v1.2.3.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build installer
        working-directory: frontend
        run: npm run package -- --publish never

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nabve1-${{ matrix.os }}
          path: |
            frontend/dist-builder/*.exe
            frontend/dist-builder/*.AppImage
            frontend/dist-builder/latest*.yml
            frontend/dist-builder/*.blockmap

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/latest*.yml
            artifacts/**/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
