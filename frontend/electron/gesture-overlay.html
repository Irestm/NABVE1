<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        pointer-events: none;
      }
      #cursor {
        width: 100%;
        height: 100%;
        display: block;
        filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.55));
      }
    </style>
  </head>
  <body>
    <!-- A classic pointer arrow, scaled by the window size (main.ts sizes
         the whole window to BASE_SIZE * scale, so the SVG just fills it). -->
    <svg id="cursor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path
        d="M4 2 L4 20 L9 15 L12.5 22 L15.5 20.5 L12 13.5 L19 13.5 Z"
        fill="#ffffff"
        stroke="#1b2430"
        stroke-width="1.4"
        stroke-linejoin="round"
      />
    </svg>
  </body>
</html>
